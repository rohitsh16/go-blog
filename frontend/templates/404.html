<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | My Blog</title>
    <script>
        (function() {
            var saved = localStorage.getItem('theme');
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            var theme = saved || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link rel="stylesheet" href="{{.BasePath}}/static/css/index.css">
    <style>
        .error-container {
            max-width: 600px;
            margin: 80px auto;
            text-align: center;
            padding: 40px 20px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            transition: background-color 0.25s ease, border-color 0.25s ease;
        }
        .error-code {
            font-size: 5rem;
            font-weight: 800;
            color: var(--text-author);
            margin: 0;
            line-height: 1;
        }
        .error-title {
            font-size: 1.8rem;
            color: var(--text-primary);
            margin: 16px 0 8px 0;
        }
        .error-desc {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 28px;
        }
        .back-btn {
            background: var(--btn-primary);
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            display: inline-block;
            transition: background 0.15s, transform 0.15s;
        }
        .back-btn:hover {
            background: var(--btn-primary-hover);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="header" style="padding: 18px 0;">
        <div class="header-nav">
            <h1 style="font-size: 1.6rem; margin: 0;"><a href="{{.BasePath}}/" style="color:var(--text-header); text-decoration:none;">My Blog</a></h1>
            <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
                <span class="theme-icon">🌙</span><span class="theme-label">Dark</span>
            </button>
        </div>
    </div>
    <div class="error-container">
        <div class="error-code">404</div>
        <h2 class="error-title">Page Not Found</h2>
        <p class="error-desc">The article or page you are looking for does not exist or has been moved.</p>
        <a href="{{.BasePath}}/" class="back-btn">← Back to Homepage</a>
    </div>
    <script src="{{.BasePath}}/static/js/theme.js"></script>
</body>
</html>
