<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | My Blog</title>
    <link rel="stylesheet" href="{{.BasePath}}/static/css/index.css">
    <style>
        .error-container {
            max-width: 600px;
            margin: 80px auto;
            text-align: center;
            padding: 40px 20px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }
        .error-code {
            font-size: 5rem;
            font-weight: 800;
            color: #6366f1;
            margin: 0;
            line-height: 1;
        }
        .error-title {
            font-size: 1.8rem;
            color: #1f2937;
            margin: 16px 0 8px 0;
        }
        .error-desc {
            color: #6b7280;
            font-size: 1.1rem;
            margin-bottom: 28px;
        }
        .back-btn {
            background: #6366f1;
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            display: inline-block;
            transition: background 0.15s;
        }
        .back-btn:hover {
            background: #4f46e5;
        }
    </style>
</head>
<body>
    <div class="header" style="padding: 24px 0;">
        <h1 style="font-size: 1.8rem; margin: 0;"><a href="{{.BasePath}}/" style="color:#fff; text-decoration:none;">My Blog</a></h1>
    </div>
    <div class="error-container">
        <div class="error-code">404</div>
        <h2 class="error-title">Page Not Found</h2>
        <p class="error-desc">The article or page you are looking for does not exist or has been moved.</p>
        <a href="{{.BasePath}}/" class="back-btn">← Back to Homepage</a>
    </div>
</body>
</html>
