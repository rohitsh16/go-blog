<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Post</title>
    <link rel="stylesheet" href="/static/css/create.css">
</head>
<body>
    <div class="container">
        <h1>Create a New Blog Post</h1>
        <form action="/create" method="POST" autocomplete="off" id="postForm">
            <div class="form-group">
                <label for="title">Title:</label>
                <input type="text" id="title" name="title" placeholder="Enter post title" required maxlength="100">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="author_name">Author (display name):</label>
                    <input type="text" id="author_name" name="author_name" placeholder="Your display name (optional)" maxlength="100">
                    <span class="form-hint">Optional — your byline or pen name</span>
                </div>

                <div class="form-group">
                    <label for="slug">Slug (optional):</label>
                    <input type="text" id="slug" name="slug" placeholder="custom-url-slug" maxlength="255">
                    <span class="form-hint">URL-friendly identifier</span>
                </div>
            </div>

            <div class="form-group">
                <label for="content">Content:</label>
                <span class="counter" id="contentCounter">0/1000</span>
                <textarea id="content" name="content" placeholder="Write your post here..." required maxlength="1000"></textarea>
            </div>

            <div class="form-group">
                <label>
                    <input type="checkbox" id="published" name="published" value="1" checked>
                    <span>Publish immediately</span>
                </label>
                <span class="form-hint">Uncheck to save as draft</span>
            </div>
            
            <div class="actions">
                <button type="submit">Create Post</button>
                <button type="reset">Reset</button>
            </div>
        <a href="/" class="back-link">&larr; Back to Home</a>

        <div class="preview" id="previewBox" style="display:none;">
            <h2>Live Preview</h2>
            <h3 id="previewTitle"></h3>
            <p id="previewContent"></p>
        </div>
    </div>
    <script>
        const content = document.getElementById('content');
        const title = document.getElementById('title');
        const counter = document.getElementById('contentCounter');
        const previewBox = document.getElementById('previewBox');
        const previewTitle = document.getElementById('previewTitle');
        const previewContent = document.getElementById('previewContent');
        const form = document.getElementById('postForm');

        function updateCounter() {
            counter.textContent = content.value.length + "/1000";
        }
        function updatePreview() {
            if (title.value.trim() || content.value.trim()) {
                previewBox.style.display = "block";
                previewTitle.textContent = title.value;
                previewContent.textContent = content.value;
            } else {
                previewBox.style.display = "none";
            }
        }
        content.addEventListener('input', () => {
            updateCounter();
            updatePreview();
        });
        title.addEventListener('input', updatePreview);
        form.addEventListener('reset', () => {
            setTimeout(() => {
                updateCounter();
                updatePreview();
            }, 10);
        });
        // Initialize on load
        updateCounter();
        updatePreview();
    </script>
</body>
</html>
